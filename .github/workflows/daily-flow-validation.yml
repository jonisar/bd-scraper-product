name: Daily flow validation

# Validates the live product pages daily: every route renders, every CLI
# command and prompt on the pages actually works, SKILL.md and API/MCP
# endpoints are alive, docs links resolve. Fails loudly so we know a flow
# broke before a user does.
#
# On failure it opens a GitHub issue assigned to anil-bd, which GitHub emails.
# Setup notes are in .github/workflows/README.md.

on:
  schedule:
    - cron: "0 5 * * *" # daily 05:00 UTC (08:00 Israel)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run flow validation against production
        env:
          BASE_URL: ${{ vars.VALIDATION_BASE_URL || 'https://bd-scraper-product.vercel.app' }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: node scripts/validate-flows.mjs
      - name: Publish report to the run summary
        if: always()
        run: cat validation-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation-report.md

      - name: Raise the alert
        if: failure()
        uses: ./.github/actions/alert-issue
        with:
          outcome: failure
          title: Daily flow validation is failing
          label: flow-validation-broken
          assignee: anil-bd
          report-path: validation-report.md

      - name: Clear the alert
        if: success()
        uses: ./.github/actions/alert-issue
        with:
          outcome: success
          title: Daily flow validation is failing
          label: flow-validation-broken
          assignee: anil-bd
